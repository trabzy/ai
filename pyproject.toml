[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.2.0"
description = "A Claude-powered personal assistant with a holographic HUD"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
voice = [
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.13",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
jarvis = "jarvis.main:main"
jarvis-hud = "jarvis.main:hud"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.web" = ["*.html", "vendor/*.js"]
